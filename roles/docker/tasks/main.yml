---
# 1. Installer les prérequis
- name: Installer les prérequis de Docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

# 2. Supprimer les anciens fichiers de dépôt Docker (pour éviter les conflits)
- name: Supprimer les anciens fichiers de configuration Docker
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/trusted.gpg.d/docker.gpg

# 3. Créer le dossier pour les clés
- name: Créer le dossier des clés APT
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# 4. Télécharger la clé GPG
- name: Télécharger la clé GPG de Docker
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

# 5. Ajouter le dépôt Docker (avec la variable de fait corrigée)
- name: Ajouter le dépôt Docker
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker

# 6. Installer Docker Engine et le plugin Docker Compose
- name: Installer Docker Engine et Docker Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

# 7. Démarrer et activer le service Docker
- name: Démarrer et activer le service Docker
  service:
    name: docker
    state: started
    enabled: yes

# 8. Autoriser l'utilisateur à exécuter Docker
- name: Ajouter l'utilisateur 'arij' au groupe docker
  user:
    name: arij
    groups: docker
    append: yes

